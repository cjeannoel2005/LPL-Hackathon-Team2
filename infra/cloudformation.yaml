AWSTemplateFormatVersion: '2010-09-09'
Description: 'LPL AI Assistant Infrastructure - OpenSearch Serverless + S3'

Parameters:
  ProjectName:
    Type: String
    Default: lpl-ai-assistant
    Description: Project name for resource naming

Resources:
  # S3 Bucket for documents
  DocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-docs-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # OpenSearch Serverless Collection
  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    Properties:
      Name: !Ref ProjectName
      Type: VECTORSEARCH
      Description: Vector database for RAG

  # OpenSearch Network Policy
  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${ProjectName}-network-policy'
      Type: network
      Policy: !Sub |
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}"]}, {"ResourceType":"dashboard","Resource":["collection/${ProjectName}"]}],"AllowFromPublic":true}]

  # OpenSearch Encryption Policy
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${ProjectName}-encryption-policy'
      Type: encryption
      Policy: !Sub |
        {"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}"]}],"AWSOwnedKey":true}

  # IAM Role for application
  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-app-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: OpenSearchAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'aoss:*'
                Resource: !GetAtt OpenSearchCollection.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt DocumentBucket.Arn
                  - !Sub '${DocumentBucket.Arn}/*'

Outputs:
  S3BucketName:
    Description: S3 Bucket for documents
    Value: !Ref DocumentBucket
    Export:
      Name: !Sub '${ProjectName}-bucket'

  OpenSearchEndpoint:
    Description: OpenSearch Collection Endpoint
    Value: !GetAtt OpenSearchCollection.CollectionEndpoint
    Export:
      Name: !Sub '${ProjectName}-opensearch-endpoint'

  ApplicationRoleArn:
    Description: IAM Role ARN for application
    Value: !GetAtt ApplicationRole.Arn
    Export:
      Name: !Sub '${ProjectName}-role-arn'

  SetupCommands:
    Description: Commands to update .env file
    Value: !Sub |
      export S3_BUCKET_NAME=${DocumentBucket}
      export OPENSEARCH_ENDPOINT=${OpenSearchCollection.CollectionEndpoint}
